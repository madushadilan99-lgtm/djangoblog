{% extends "blog/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<h1>Reset Password</h1>

<p>Enter your email address to reset your password.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Send Reset Link
    </button>
</form>
{% endblock %}
