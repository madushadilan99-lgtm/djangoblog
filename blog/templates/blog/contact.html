{% extends "blog/base.html" %}

{% block title %}Contact - DjangoBlog{% endblock %}

{% block content %}

<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">

            <h1>Contact Us</h1>

            <p>
                If you have questions or feedback about DjangoBlog,
                we welcome your suggestions and comments.
                Thank you for visiting!
            </p>

            <p class="text-muted">
                {{ contact }}
            </p>

            <a href="{% url 'home' %}" class="btn btn-primary">
                Back to Home
            </a>

        </div>
    </div>
</div>

{% endblock %}
